<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .con{
            height: 600px;
            border: 1px solid black;
        }
        .header{
            height: 20%;
            background-color: rgb(127, 255, 212);
        }
        .center{
            height: 60%;
            background-color: rgb(96, 192, 0);
            display: flex;
        }
        .left{
            width: 30%;
            background-color: rgb(82, 154, 255);
        }
        .right{
            width: 70%;
            background-color: brown;
        }
        .top{
            height: 50%;
            background-color: rgb(8, 197, 255);
        }
        .bottom{
            height: 50%;
            background-color: cadetblue;
            display: flex;
        }
        .bleft{
            width: 50%;
            background-color: rgba(10, 1, 188, 0.445);
        }
        .bright{
            width: 50%;
            background-color: rgb(0, 223, 252);
        }
        .footer{
            height: 20%;
            background-color: rgb(127, 255, 212);
        }

    </style>
</head>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
        <div class="header">
            <h2 align="center"> Header </h2>
        </div>
        <div class="center">
            <div class="left"><h2 align="center">Left</h2></div>
            <div class="right">
                <div class="top"><h2 align="center">Top</h2></div>
                <div class="bottom">
                    <div class="bleft"><h2 align="center">Bottom Left</h2></div>
                  <div class="bright"><h2 align="center">Bottom Right</h2></div>
                </div>
            </div>
        </div>
        <div class="footer"><h2 align="center">Footer</h2></div>
    </div>
</body>
</html>
