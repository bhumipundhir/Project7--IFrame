<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">
    <style>
        .con{
            height: 600px;
            /* border: 1px solid black; */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            /* border: 1px solid black; */
            display: flex;
        }
        .left,.center,.right{
            height: 100%;
            /* border: 1px solid black; */
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width:62%;
            font-size: 60px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
            background-color: whitesmoke;
        }
        h1{
            margin-left: 20px;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .right{
            width: 35%;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .top{
            height: 30%;
            /* border: 1px solid black; */
        }
        .bottom{
            height: 70%;
            /* border: 1px solid black; */
        }
        .top_in{
            border-top-right-radius: 20px;
            border-top-left-radius: 20px;
            height: 90%;
            /* border: 1px solid black; */
            background-color: navy;
        }
        .circle{
            position: absolute;
            top: 80px;
            height: 125px;
            width: 125px;
            right: 260px;
            border: 5px solid navy;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
        }
        .bottom>h1,.icon,.button{
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }
        .icon{
            display: flex;
            justify-content: center;
            gap:10px;
        }
        .button{
            height: 20%;
            /* border: 1px solid black; */
            color: white;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .button1{
            height: 50%;
            border-radius: 20px;
            width: 40%;
            color: aliceblue;
            background-color: navy;
            border: 1px solid black;
            text-align: center;
            line-height: 30px;
        }
        .fa-facebook{
            color:blue;
        }
        .fa-github{
            color: violet;
        }
        .fa-linkedin{
            color: skyblue;
        }
        .fa-instagram{
          background:linear-gradient(red,orange,violet) ;
          color: transparent ;
          background-clip:text;
        }
        .fa-heart{
            color: red;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top_in">
                        <div class="circle">
                            <img src="img2.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                <h1>Website Developer</h1>
                <h1>Dezyne École College</h1>
                <h1>BCA 1st Year</h1>
                <div class="icon">
                    <i class="fa fa-brands fa-2x fa-facebook"></i>
                    <i class="fa fa-brands fa-2x fa-instagram"></i>
                    <i class="fa fa-brands fa-2x fa-github"></i>
                    <i class="fa fa-brands fa-2x fa-linkedin"></i>
                    <i class="fa fa-brands fa-2x fa-behance"></i>
                </div>
                <div class="button">
                    <div class="button1">Subscribe</div>
                    <div class="button1">Message</div>
                </div>
                <div class="icon">
                    <i class="fa fa-solid fa-heart"></i>60.4k
                    <i class="fa fa-solid fa-comment"></i>20k
                    <i class="fa fa-solid fa-share fa-flip-horizontal"></i>12.6k
                </div>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
